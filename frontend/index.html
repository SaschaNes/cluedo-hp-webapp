<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Cluedo Sheet</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- Fallback Background (IMMER sichtbar, kein Schwarz) -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(
          ellipse at top,
          rgba(30, 30, 30, 0.95),
          #000
        );
      }

      /* Splash Overlay */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: radial-gradient(
          ellipse at top,
          rgba(30, 30, 30, 0.95),
          #000
        );
        transition: opacity 160ms ease;
      }

      #app-splash.hide {
        opacity: 0;
        pointer-events: none;
      }

      #app-splash .title {
        font-family: "Cinzel Decorative", serif;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: rgba(233, 216, 166, 0.85);
        font-size: 18px;
      }
    </style>

    <!-- Theme-Key sofort setzen -->
    <script>
      try {
        const k = localStorage.getItem("hpTheme:guest") || "default";
        document.documentElement.setAttribute("data-theme", k);
      } catch {}
    </script>
  </head>

  <body>
    <!-- ✅ Splash ist sichtbar, App lädt dahinter -->
    <div id="app-splash">
      <div class="title">Zauber-Detektiv Notizbogen</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
